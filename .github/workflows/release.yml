name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Check release identity and registry
        id: registry
        env:
          EXPECTED_PACKAGE: '@kubohiroya/turbowarp-app-template'
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-npm-release.mjs
      # prepack runs the complete package verification before stable publication.
      - name: Publish with the configured npm trusted publisher
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --access public --provenance
      - name: Synchronize npm distribution tags
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          for tag in latest next; do
            if [ "$(npm view "$name" "dist-tags.$tag" --prefer-online)" != "$version" ]; then
              npm dist-tag add "$name@$version" "$tag"
            fi
          done
